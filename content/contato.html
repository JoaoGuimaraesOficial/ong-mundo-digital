<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONG Mundo Digital</title>
    <script src="../js/layout-push.js" defer></script>
    <script src="../js/animation.js" defer></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div id="header"></div>

    <main>
      <section id="contato">
        <h2>Entre em contato</h2>

        <p>Tem dúvidas ou deseja participar? Envie uma mensagem para nós.</p>

        <p><strong>E-mail:</strong> contato@conectafuturo.org</p>
        <p><strong>Telefone:</strong> (11) 98765-4321</p>
        <p><strong>Endereço:</strong> Rua da Tecnologia, 123 – São Paulo/SP</p>

        <form action="#" method="post">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <label for="assunto">Assunto:</label>
          <input type="text" id="assunto" name="assunto" required />

          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" required></textarea>

          <button type="submit">Enviar mensagem</button>
        </form>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
